name: Deploy active syllabi

on:
  push:
    branches: main
    tags:
      - v*
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Working directory check
        run: |
          pwd
          ls

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          # Pinned to the version the build is tested against locally.
          pandoc-version: '3.10.1'

      # build.sh calls scripts/date-formatter.py to regenerate the Markdown
      # schedules from their CSV. The script needs no packages beyond the
      # standard library, so there is nothing to pip install.
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The Ubuntu 'texlive' apt package is too old for the PDF/UA-2 tagging
      # that build.sh requests via -V pdfstandard=ua-2, so install TeX Live
      # proper. The action used here is the one recommended by
      # TeX-Live/setup-texlive-action itself. It installs scheme-infraonly, so
      # every package the build needs must be listed. The package file is split
      # on whitespace and '#' comments are stripped, so one name per line works.
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .config/tl_packages

      # build.sh passes --lua-filter=include-files.lua, which Pandoc resolves
      # relative to the working directory.
      - name: Download lua-filter
        run: wget https://raw.githubusercontent.com/pandoc/lua-filters/master/include-files/include-files.lua

      - name: Verify dependencies
        run: |
          pandoc --version
          lualatex --version
          python3 --version
          ls include-files.lua

      - name: Build
        run: bash build.sh

      - name: Check for Resulting PDF
        run: |
          ls build/*.pdf

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/*.pdf
